    <path d="M214 400 V452 L256 472 L298 452 V400 Z" fill="#8f5a35"/>
    <path d="M214 418 Q256 452 298 418 V400 H214 Z" fill="#5e351c"/>
    <!-- ears -->
    <path d="M168 282 C152 280 150 314 166 324 Z" fill="#d6a274"/><path d="M344 282 C360 280 362 314 346 324 Z" fill="#8f5a35"/>
    <!-- face: lit from the upper left -->
    <path d="M168 246 H344 L350 300 C348 342 332 374 308 398 L284 420 Q256 434 228 420 L204 398 C180 374 164 342 162 300 Z" fill="#dcab7c"/>
    <path d="M296 246 H344 L350 300 C348 342 332 374 308 398 L284 420 Q268 428 258 430 L266 396 C296 362 310 320 300 280 Z" fill="#9c643b"/>
