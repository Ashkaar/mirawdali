<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5a34"/><stop offset="1" stop-color="#3f2614"/></linearGradient>
    <pattern id="check" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="24" height="24" fill="#f2efe8"/><rect width="12" height="12" fill="#141110"/><rect x="12" y="12" width="12" height="12" fill="#141110"/>
    </pattern>
    <pattern id="checkBand" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="22" height="22" fill="#f2efe8"/><rect width="11" height="11" fill="#141110"/><rect x="11" y="11" width="11" height="11" fill="#141110"/>
    </pattern>
    <linearGradient id="wrapShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".05"/><stop offset=".55" stop-color="#000" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="foldShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <clipPath id="wrap"><path d="M146 246 C130 186 156 124 210 106 C240 96 272 96 302 106 C356 124 382 186 366 246 C330 266 182 266 146 246 Z"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
