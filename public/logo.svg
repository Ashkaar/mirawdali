    <g transform="translate(256 318) scale(1.12) translate(-256 -300)">
    <!-- coat and shirt -->
    <path d="M58 512 C78 452 150 428 212 440 L256 472 L300 440 C362 428 434 452 454 512 Z" fill="#22130a"/>
    <path d="M212 440 L256 490 L300 440 L286 436 L256 466 L226 436 Z" fill="#e6d8c2"/>
