    <path d="M172 300 L208 318 L200 366 L182 348 Z" fill="#c38f62"/>
    <path d="M300 310 L330 296 L336 336 L316 366 Z" fill="#7a4a2a"/>
    <!-- deep eye sockets under a heavy brow -->
    <path d="M180 266 L240 262 L252 292 L226 302 L188 294 Z" fill="#7e4b2b"/>
    <path d="M272 262 L332 266 L324 294 L286 302 L260 292 Z" fill="#5f361d"/>
    <!-- eyes, narrowed and looking straight ahead -->
    <path d="M196 286 Q216 276 238 286 Q216 293 196 286 Z" fill="#ece0cc"/><circle cx="219" cy="285.5" r="6.5" fill="#160b05"/>
    <path d="M274 286 Q296 276 316 286 Q296 293 274 286 Z" fill="#cdbfa8"/><circle cx="293" cy="285.5" r="6.5" fill="#160b05"/>
    <!-- furrowed brows angled down to the centre -->
    <path d="M174 262 L240 272 L254 258 L200 244 Z" fill="#1d0f07"/>
    <path d="M338 262 L272 272 L258 258 L312 244 Z" fill="#1d0f07"/>
    <path d="M252 262 L256 292 L260 262 Z" fill="#a46c42"/>
    <!-- nose: lit bridge, shadowed side and base -->
    <path d="M258 290 L276 334 L262 344 L254 338 Z" fill="#8a5432"/>
    <path d="M238 334 Q240 344 250 344 L246 336 Z" fill="#3a2112"/><path d="M274 334 Q272 344 262 344 L266 336 Z" fill="#3a2112"/><path d="M248 342 Q256 347 264 342" fill="none" stroke="#7a4a2a" stroke-width="3"/>
    <!-- thick moustache and short beard -->
    <path d="M196 386 C188 404 214 424 256 432 C298 424 324 404 316 386 C304 404 286 414 256 416 C226 414 208 404 196 386 Z" fill="#2a170b"/>
    <path d="M178 350 C182 386 206 414 236 426 L228 404 C206 392 190 372 186 352 Z" fill="#3a2112"/>
    <path d="M334 350 C330 386 306 414 276 426 L284 404 C306 392 322 372 326 352 Z" fill="#2a170b"/>
    <path d="M202 372 C210 350 236 346 256 354 C276 346 302 350 310 372 L316 392 C298 378 278 374 256 378 C234 374 214 378 196 392 Z" fill="#1d0f07"/>
    <path d="M240 392 Q256 398 272 392 L266 402 Q256 406 246 402 Z" fill="#b57b50"/>
    <!-- black and white jamana, wrapped -->
    <path d="M168 222 C140 260 134 314 146 366 L172 360 C166 312 172 270 190 238 Z" fill="url(#check)"/>
    <path d="M168 222 C140 260 134 314 146 366 L172 360 C166 312 172 270 190 238 Z" fill="#000" opacity=".3"/>
    <g fill="#141110"><path d="M144 364 l-4 16 h10 z"/><path d="M158 362 l-3 16 h10 z"/><path d="M171 360 l-2 15 h9 z"/></g>
    <g clip-path="url(#wrap)">
      <rect x="120" y="90" width="270" height="180" fill="url(#check)"/>
      <rect x="120" y="90" width="270" height="180" fill="url(#wrapShade)"/>
      <path d="M130 200 C200 168 310 158 380 190 L380 214 C310 186 200 196 130 226 Z" fill="url(#foldShade)"/>
      <path d="M140 150 C210 128 300 122 370 148 L370 168 C300 144 210 150 140 174 Z" fill="url(#foldShade)"/>
    </g>
    <path d="M142 214 C200 196 312 190 370 212 L366 250 C330 270 182 270 146 250 Z" fill="url(#checkBand)"/>
    <path d="M142 214 C200 196 312 190 370 212 L366 250 C330 270 182 270 146 250 Z" fill="url(#wrapShade)"/>
    <path d="M142 214 C200 196 312 190 370 212" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="5"/>
    <path d="M146 250 C182 270 330 270 366 250" fill="none" stroke="#141110" stroke-width="6"/>
    <g fill="#141110"><path d="M168 252 l-5 14 h10 z"/><path d="M182 252 l-5 14 h10 z"/><path d="M196 252 l-5 14 h10 z"/><path d="M210 252 l-5 14 h10 z"/><path d="M224 252 l-5 14 h10 z"/><path d="M238 252 l-5 14 h10 z"/><path d="M252 252 l-5 14 h10 z"/><path d="M266 252 l-5 14 h10 z"/><path d="M280 252 l-5 14 h10 z"/><path d="M294 252 l-5 14 h10 z"/><path d="M308 252 l-5 14 h10 z"/><path d="M322 252 l-5 14 h10 z"/><path d="M336 252 l-5 14 h10 z"/></g>
    </g>
  </g>
</svg>